services:
  - type: web
    name: correio-content-hub
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: correio-content-hub-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_SEARCH_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: correio-content-hub-db
    plan: free
    region: virginia
    databaseName: correio_content_hub_production
    ipAllowList: []
